<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexChat</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap');
  :root {
    --bg-void:#080b0f;--bg-deep:#0d1117;--bg-mid:#141b24;--bg-surface:#1a2333;
    --bg-raised:#1f2d3d;--bg-hover:#253447;
    --accent:#00e5ff;--accent-dim:#00a8c4;--accent-glow:rgba(0,229,255,.15);
    --accent2:#ff6b35;--accent2-glow:rgba(255,107,53,.15);
    --green:#00ff88;--green-glow:rgba(0,255,136,.15);--red:#ff4757;
    --text-primary:#e8eef4;--text-secondary:#7a95b0;--text-muted:#3d5570;
    --border:rgba(0,229,255,.08);--border-active:rgba(0,229,255,.3);
    --shadow:0 8px 32px rgba(0,0,0,.6);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'JetBrains Mono',monospace;background:var(--bg-void);color:var(--text-primary);height:100vh;overflow:hidden;display:flex;flex-direction:column}

  /* ── SETUP ── */
  #setup-screen{position:fixed;inset:0;background:var(--bg-void);display:flex;align-items:center;justify-content:center;z-index:1000;background-image:radial-gradient(ellipse at 20% 50%,rgba(0,229,255,.05) 0%,transparent 60%),radial-gradient(ellipse at 80% 50%,rgba(255,107,53,.05) 0%,transparent 60%)}
  .setup-card{background:var(--bg-deep);border:1px solid var(--border-active);border-radius:16px;padding:48px;width:440px;box-shadow:0 0 80px rgba(0,229,255,.1),var(--shadow)}
  .setup-logo{font-family:'Syne',sans-serif;font-size:32px;font-weight:800;color:var(--accent);text-shadow:0 0 30px var(--accent);margin-bottom:8px;letter-spacing:-1px}
  .setup-logo span{color:var(--accent2)}
  .setup-sub{color:var(--text-secondary);font-size:11px;margin-bottom:36px;letter-spacing:2px;text-transform:uppercase}
  .role-btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
  .role-btn{padding:20px 16px;border-radius:12px;border:1px solid var(--border);background:var(--bg-surface);color:var(--text-secondary);cursor:pointer;font-family:'Syne',sans-serif;font-size:13px;font-weight:600;transition:all .2s;text-align:center}
  .role-btn:hover,.role-btn.active{border-color:var(--accent);color:var(--accent);background:var(--accent-glow);box-shadow:0 0 20px var(--accent-glow)}
  .role-btn .icon{font-size:24px;display:block;margin-bottom:8px}
  .setup-input{width:100%;background:var(--bg-surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;color:var(--text-primary);font-family:'JetBrains Mono',monospace;font-size:13px;outline:none;margin-bottom:10px;transition:border-color .2s}
  .setup-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
  .setup-input::placeholder{color:var(--text-muted)}
  .server-row{display:flex;gap:8px;margin-bottom:10px}
  .server-row .setup-input{margin-bottom:0}
  .setup-launch{width:100%;padding:16px;background:var(--accent);color:var(--bg-void);border:none;border-radius:10px;font-family:'Syne',sans-serif;font-size:14px;font-weight:700;cursor:pointer;letter-spacing:1px;transition:all .2s}
  .setup-launch:hover{background:#fff;box-shadow:0 0 30px var(--accent)}
  .conn-status{font-size:11px;color:var(--text-muted);text-align:center;margin-top:12px;height:16px}
  .conn-status.connecting{color:var(--accent2)}
  .conn-status.error{color:var(--red)}

  /* ── LAYOUT ── */
  #app{display:flex;height:100vh}
  .sidebar{width:260px;background:var(--bg-deep);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
  .sidebar-header{padding:20px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
  .logo-small{font-family:'Syne',sans-serif;font-weight:800;font-size:18px;color:var(--accent);text-shadow:0 0 15px var(--accent)}
  .logo-small span{color:var(--accent2)}
  .host-badge{margin-left:auto;font-size:9px;background:var(--accent-glow);border:1px solid var(--accent);color:var(--accent);padding:2px 8px;border-radius:20px;letter-spacing:1px}
  .channels-section{flex:1;overflow-y:auto;padding:8px 0}
  .channels-section::-webkit-scrollbar{width:4px}
  .channels-section::-webkit-scrollbar-thumb{background:var(--text-muted);border-radius:2px}
  .section-label{font-size:9px;color:var(--text-muted);letter-spacing:2px;text-transform:uppercase;padding:16px 16px 6px;display:flex;align-items:center;justify-content:space-between}
  .add-channel-btn{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:16px;line-height:1;transition:color .2s}
  .add-channel-btn:hover{color:var(--accent)}
  .channel-item{display:flex;align-items:center;gap:10px;padding:8px 12px;margin:2px 8px;border-radius:8px;cursor:pointer;color:var(--text-secondary);font-size:12px;transition:all .15s;position:relative}
  .channel-item:hover{background:var(--bg-hover);color:var(--text-primary)}
  .channel-item.active{background:var(--bg-surface);color:var(--accent)}
  .channel-item.active::before{content:'';position:absolute;left:-8px;top:50%;transform:translateY(-50%);width:3px;height:20px;background:var(--accent);border-radius:0 3px 3px 0;box-shadow:0 0 8px var(--accent)}
  .channel-hash{font-size:14px;color:var(--text-muted);font-weight:bold}
  .channel-item.active .channel-hash{color:var(--accent)}
  .unread-dot{margin-left:auto;width:6px;height:6px;background:var(--accent2);border-radius:50%;box-shadow:0 0 6px var(--accent2)}

  /* ONLINE LIST */
  .online-section{border-top:1px solid var(--border);padding:8px 0;max-height:140px;overflow-y:auto}
  .online-section::-webkit-scrollbar{width:3px}
  .online-item{display:flex;align-items:center;gap:8px;padding:5px 12px;font-size:11px;color:var(--text-secondary)}
  .o-dot{width:7px;height:7px;background:var(--green);border-radius:50%;box-shadow:0 0 5px var(--green);flex-shrink:0}
  .o-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .o-role{font-size:9px;color:var(--text-muted)}

  /* UPLOAD REQUESTS */
  .upload-requests{border-top:1px solid var(--border);padding:12px;max-height:220px;overflow-y:auto}
  .upload-req-title{font-size:9px;color:var(--text-muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:6px}
  .req-count{background:var(--accent2);color:white;font-size:9px;padding:1px 5px;border-radius:10px;min-width:16px;text-align:center}
  .upload-req-item{background:var(--bg-surface);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:6px;animation:slideIn .3s ease}
  @keyframes slideIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
  .req-filename{font-size:11px;color:var(--text-primary);margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .req-meta{font-size:10px;color:var(--text-secondary);margin-bottom:8px}
  .req-btns{display:flex;gap:6px}
  .req-allow,.req-deny{flex:1;padding:5px;border:none;border-radius:6px;font-family:'JetBrains Mono',monospace;font-size:10px;cursor:pointer;font-weight:500;transition:all .15s}
  .req-allow{background:var(--green-glow);border:1px solid var(--green);color:var(--green)}
  .req-allow:hover{background:var(--green);color:var(--bg-void)}
  .req-deny{background:rgba(255,71,87,.1);border:1px solid var(--red);color:var(--red)}
  .req-deny:hover{background:var(--red);color:white}

  /* USER BAR */
  .user-bar{padding:12px 16px;border-top:1px solid var(--border);background:var(--bg-void);display:flex;align-items:center;gap:10px}
  .user-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:var(--bg-void);flex-shrink:0;position:relative}
  .user-avatar::after{content:'';position:absolute;bottom:0;right:0;width:9px;height:9px;background:var(--green);border:2px solid var(--bg-void);border-radius:50%;box-shadow:0 0 6px var(--green)}
  .user-name{font-size:12px;font-weight:500;flex:1}
  .user-role-tag{font-size:9px;color:var(--text-muted)}

  /* CHAT */
  .chat-area{flex:1;display:flex;flex-direction:column;background:var(--bg-mid);overflow:hidden}
  .chat-header{padding:0 20px;height:56px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;background:var(--bg-deep);flex-shrink:0}
  .chat-channel-name{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;color:var(--text-primary)}
  .chat-channel-name .hash{color:var(--accent);margin-right:4px}
  .chat-header-sep{width:1px;height:20px;background:var(--border);margin:0 4px}
  .chat-topic{font-size:11px;color:var(--text-muted)}
  .online-count{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-secondary)}
  .online-dot{width:6px;height:6px;background:var(--green);border-radius:50%;box-shadow:0 0 6px var(--green)}

  /* MESSAGES */
  .messages{flex:1;overflow-y:auto;padding:20px 20px 0;display:flex;flex-direction:column;gap:2px;scroll-behavior:smooth}
  .messages::-webkit-scrollbar{width:6px}
  .messages::-webkit-scrollbar-thumb{background:var(--text-muted);border-radius:3px}
  .msg-group{display:flex;gap:14px;padding:6px 0;border-radius:8px;transition:background .1s}
  .msg-group:hover{background:rgba(255,255,255,.02);padding-left:8px;margin-left:-8px}
  .msg-avatar{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:700;font-size:14px;margin-top:2px}
  .msg-content{flex:1;min-width:0}
  .msg-header{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
  .msg-author{font-family:'Syne',sans-serif;font-size:13px;font-weight:700}
  .msg-time{font-size:10px;color:var(--text-muted)}
  .msg-text{font-size:13px;color:var(--text-secondary);line-height:1.6;word-break:break-word}

  /* LIVE TYPING */
  .live-preview{background:var(--bg-surface);border:1px solid rgba(0,229,255,.2);border-radius:8px;padding:10px 14px;margin:4px 0;position:relative;overflow:hidden}
  .live-preview::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);box-shadow:0 0 8px var(--accent)}
  .live-label{font-size:9px;color:var(--accent);letter-spacing:2px;text-transform:uppercase;margin-bottom:4px;display:flex;align-items:center;gap:6px}
  .live-pulse{width:6px;height:6px;background:var(--accent);border-radius:50%;animation:pulse 1s ease infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.7)}}
  .live-text{font-size:13px;color:var(--text-primary);line-height:1.5;min-height:18px}
  .live-cursor{display:inline-block;width:2px;height:14px;background:var(--accent);margin-left:2px;vertical-align:middle;animation:blink .7s step-end infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

  /* FILE MSG */
  .file-msg{display:flex;align-items:center;gap:12px;background:var(--bg-surface);border:1px solid var(--border);border-radius:8px;padding:12px 14px;max-width:380px;margin-top:4px}
  .file-icon{font-size:24px;flex-shrink:0}
  .file-info{flex:1;min-width:0}
  .file-name{font-size:12px;color:var(--text-primary);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .file-size{font-size:10px;color:var(--text-muted)}
  .file-dl{background:none;border:1px solid var(--accent);border-radius:6px;color:var(--accent);padding:5px 10px;cursor:pointer;font-size:10px;font-family:'JetBrains Mono',monospace;transition:all .15s}
  .file-dl:hover{background:var(--accent);color:var(--bg-void)}
  .upload-progress-bar{height:3px;background:var(--bg-raised);border-radius:2px;margin-top:6px;overflow:hidden}
  .upload-progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));border-radius:2px;transition:width .3s ease;box-shadow:0 0 8px var(--accent)}
  .pending-file-msg{opacity:.6;filter:grayscale(.5)}
  .pending-label{font-size:10px;color:var(--accent2);margin-top:4px;display:flex;align-items:center;gap:4px}
  .spin{display:inline-block;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* SYS MSG */
  .sys-msg{display:flex;align-items:center;gap:12px;font-size:11px;color:var(--text-muted);padding:4px 0}
  .sys-msg::before,.sys-msg::after{content:'';flex:1;height:1px;background:var(--border)}

  /* INPUT */
  .input-area{padding:16px 20px 20px;background:var(--bg-mid);flex-shrink:0}
  .input-typing-indicator{font-size:11px;color:var(--text-muted);margin-bottom:8px;height:14px;display:flex;align-items:center;gap:6px}
  .typing-dots span{display:inline-block;width:3px;height:3px;background:var(--accent);border-radius:50%;animation:typingBounce 1.2s ease infinite}
  .typing-dots span:nth-child(2){animation-delay:.2s}
  .typing-dots span:nth-child(3){animation-delay:.4s}
  @keyframes typingBounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-4px)}}
  .input-box{display:flex;align-items:flex-end;gap:10px;background:var(--bg-surface);border:1px solid var(--border);border-radius:12px;padding:10px 10px 10px 16px;transition:border-color .2s}
  .input-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
  .msg-input{flex:1;background:none;border:none;outline:none;color:var(--text-primary);font-family:'JetBrains Mono',monospace;font-size:13px;resize:none;max-height:120px;line-height:1.5;scrollbar-width:none}
  .msg-input::placeholder{color:var(--text-muted)}
  .input-actions{display:flex;gap:6px;align-items:flex-end}
  .action-btn{width:34px;height:34px;border-radius:8px;border:none;background:var(--bg-raised);color:var(--text-secondary);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .15s;flex-shrink:0}
  .action-btn:hover{background:var(--bg-hover);color:var(--accent)}
  .send-btn{background:var(--accent);color:var(--bg-void)}
  .send-btn:hover{background:#fff;box-shadow:0 0 15px var(--accent)}

  /* TOAST */
  #toast-container{position:fixed;bottom:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
  .toast{background:var(--bg-raised);border-radius:10px;padding:12px 16px;font-size:12px;display:flex;align-items:center;gap:10px;animation:toastIn .3s ease;pointer-events:all;max-width:300px}
  .toast.success{border-left:3px solid var(--green)}
  .toast.error{border-left:3px solid var(--red)}
  .toast.info{border-left:3px solid var(--accent)}
  @keyframes toastIn{from{opacity:0;transform:translateY(10px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}

  /* MODAL */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:500;backdrop-filter:blur(4px)}
  .modal{background:var(--bg-deep);border:1px solid var(--border-active);border-radius:12px;padding:28px;width:340px;box-shadow:var(--shadow)}
  .modal h3{font-family:'Syne',sans-serif;font-size:16px;margin-bottom:16px}
  .modal-btns{display:flex;gap:8px;margin-top:16px}
  .modal-cancel{flex:1;padding:10px;border:1px solid var(--border);border-radius:8px;background:none;color:var(--text-secondary);font-family:'JetBrains Mono',monospace;font-size:12px;cursor:pointer;transition:all .15s}
  .modal-cancel:hover{border-color:var(--text-secondary);color:var(--text-primary)}
  .modal-confirm{flex:1;padding:10px;border:none;border-radius:8px;background:var(--accent);color:var(--bg-void);font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s}
  .modal-confirm:hover{background:#fff}
  .hidden{display:none !important}

  /* WS indicator */
  .ws-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
  .ws-dot.connected{background:var(--green);box-shadow:0 0 5px var(--green)}
  .ws-dot.disconnected{background:var(--red)}
  .ws-dot.connecting{background:var(--accent2);animation:pulse 1s ease infinite}
</style>
</head>
<body>

<!-- SETUP -->
<div id="setup-screen">
  <div class="setup-card">
    <div class="setup-logo">Nex<span>Chat</span></div>
    <div class="setup-sub">Secure · Live · Real-Time</div>

    <div class="role-btns">
      <button class="role-btn active" id="btn-host" onclick="selectRole('host')">
        <span class="icon">🖥️</span>HOST
      </button>
      <button class="role-btn" id="btn-client" onclick="selectRole('client')">
        <span class="icon">👤</span>CLIENT
      </button>
    </div>

    <input type="text" class="setup-input" id="username-input" placeholder="Benutzername..." maxlength="24">

    <div class="server-row">
      <input type="text" class="setup-input" id="server-input" placeholder="Server: localhost:3000" style="flex:1">
    </div>

    <button class="setup-launch" onclick="launch()">▶ VERBINDEN</button>
    <div class="conn-status" id="conn-status"></div>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="logo-small">Nex<span>Chat</span></div>
      <div class="ws-dot connected" id="ws-dot" title="Verbunden"></div>
      <div class="host-badge" id="role-badge">HOST</div>
    </div>

    <div class="channels-section" id="channels-list"></div>

    <!-- online users -->
    <div class="online-section" id="online-section">
      <div class="section-label">ONLINE</div>
      <div id="online-list"></div>
    </div>

    <!-- upload requests HOST only -->
    <div class="upload-requests" id="upload-req-panel">
      <div class="upload-req-title">UPLOAD-ANFRAGEN <span class="req-count" id="req-count">0</span></div>
      <div id="upload-req-list"><div style="font-size:11px;color:var(--text-muted);text-align:center;padding:8px 0">Keine Anfragen</div></div>
    </div>

    <div class="user-bar">
      <div class="user-avatar" id="user-avatar-bar" style="background:linear-gradient(135deg,#00e5ff,#ff6b35)">U</div>
      <div>
        <div class="user-name" id="user-name-bar">-</div>
        <div class="user-role-tag" id="user-role-bar">-</div>
      </div>
    </div>
  </div>

  <div class="chat-area">
    <div class="chat-header">
      <div class="chat-channel-name"><span class="hash">#</span><span id="active-channel-name">allgemein</span></div>
      <div class="chat-header-sep"></div>
      <div class="chat-topic" id="channel-topic">Willkommen</div>
      <div class="online-count"><div class="online-dot"></div><span id="online-count">0 online</span></div>
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-area">
      <div class="input-typing-indicator" id="typing-indicator"></div>
      <div class="input-box">
        <textarea class="msg-input" id="msg-input" placeholder="Nachricht schreiben..." rows="1"></textarea>
        <div class="input-actions">
          <button class="action-btn" onclick="triggerFileUpload()" title="Datei senden">📎</button>
          <button class="action-btn send-btn" onclick="sendMessage()">➤</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ADD CHANNEL MODAL -->
<div class="modal-overlay hidden" id="add-channel-modal">
  <div class="modal">
    <h3>📢 Neuen Kanal erstellen</h3>
    <input type="text" class="setup-input" id="new-channel-name" placeholder="kanal-name..." maxlength="32" style="margin-bottom:8px">
    <input type="text" class="setup-input" id="new-channel-topic" placeholder="Thema (optional)..." maxlength="80">
    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeAddChannel()">Abbrechen</button>
      <button class="modal-confirm" onclick="confirmAddChannel()">Erstellen</button>
    </div>
  </div>
</div>

<input type="file" id="file-input" style="display:none" onchange="handleFileSelect(event)" multiple>
<div id="toast-container"></div>

<script>
// ─── STATE ───────────────────────────────────────
let ws = null;
let myName = '';
let myRole = 'host';
let myColor = '#00e5ff';
let activeChannel = 'allgemein';
let channels = [];
let messages = {};
let liveTyping = {};
let onlineUsers = [];
let storedFiles = {};
let pendingUploads = {};
let uploadRequestsLocal = {};

let typingTimer = null;
let isTyping = false;

const COLORS = ['#00e5ff','#ff6b35','#00ff88','#a29bfe','#fdcb6e','#e17055','#74b9ff','#fd79a8'];

// ─── SETUP ───────────────────────────────────────
function selectRole(role) {
  myRole = role;
  document.getElementById('btn-host').classList.toggle('active', role==='host');
  document.getElementById('btn-client').classList.toggle('active', role==='client');
}

function launch() {
  const name = document.getElementById('username-input').value.trim();
  if (!name) { toast('Benutzername erforderlich','error'); return; }

  let serverAddr = document.getElementById('server-input').value.trim() || 'localhost:3000';
  if (!serverAddr.startsWith('ws')) {
    serverAddr = location.protocol === 'https:' ? 'wss://' + serverAddr : 'ws://' + serverAddr;
  }

  myName = name;
  myColor = COLORS[hashStr(name) % COLORS.length];

  const statusEl = document.getElementById('conn-status');
  statusEl.className = 'conn-status connecting';
  statusEl.textContent = 'Verbinde...';

  ws = new WebSocket(serverAddr);

  ws.onopen = () => {
    statusEl.textContent = '';
    ws.send(JSON.stringify({ type:'join', name:myName, role:myRole, color:myColor }));
  };

  ws.onmessage = (e) => handleMessage(JSON.parse(e.data));

  ws.onerror = () => {
    statusEl.className = 'conn-status error';
    statusEl.textContent = '❌ Verbindung fehlgeschlagen — Server erreichbar?';
  };

  ws.onclose = () => {
    document.getElementById('ws-dot').className = 'ws-dot disconnected';
    toast('Verbindung getrennt','error');
  };
}

// ─── MESSAGE HANDLER ─────────────────────────────
function handleMessage(d) {
  switch(d.type) {

    case 'welcome':
      myRole = d.yourRole;
      channels = d.channels;
      onlineUsers = d.onlineUsers;
      channels.forEach(c => { messages[c.id] = d.history[c.id] || []; });
      initApp();
      break;

    case 'user-joined':
      onlineUsers = d.onlineUsers;
      renderOnlineUsers();
      updateOnlineCount();
      addSystemMsg(activeChannel, `${d.name} ist beigetreten`);
      break;

    case 'user-left':
      onlineUsers = d.onlineUsers;
      renderOnlineUsers();
      updateOnlineCount();
      addSystemMsg(activeChannel, `${d.name} hat den Chat verlassen`);
      break;

    case 'message':
      if (!messages[d.channel]) messages[d.channel] = [];
      messages[d.channel].push(d);
      if (d.channel === activeChannel) { appendMessageToDOM(d); scrollBottom(); }
      else markUnread(d.channel);
      break;

    case 'typing':
      if (!liveTyping[d.channel]) liveTyping[d.channel] = {};
      liveTyping[d.channel][d.user] = { text: d.text, color: d.color };
      if (d.channel === activeChannel) { renderLiveTyping(); updateTypingIndicator(); }
      break;

    case 'stopTyping':
      if (liveTyping[d.channel]) delete liveTyping[d.channel][d.user];
      if (d.channel === activeChannel) { renderLiveTyping(); updateTypingIndicator(); }
      break;

    case 'channel-add':
      if (!channels.find(c=>c.id===d.channel.id)) {
        channels.push(d.channel);
        messages[d.channel.id] = [];
        renderChannels();
        toast(`Neuer Kanal: #${d.channel.name}`,'info');
      }
      break;

    case 'file-request':
      // host receives this
      uploadRequestsLocal[d.requestId] = d;
      renderUploadRequests();
      toast(`📎 Upload-Anfrage: ${d.filename}`,'info');
      break;

    case 'file-approved':
      toast(`✅ Genehmigt: ${d.filename}`,'success');
      finalizeUpload(d.requestId);
      break;

    case 'file-denied':
      toast(`❌ Abgelehnt: ${d.filename}`,'error');
      markDenied(d.requestId);
      break;

    case 'file-message':
      if (!messages[d.channel]) messages[d.channel] = [];
      messages[d.channel].push(d);
      if (d.channel === activeChannel) { appendMessageToDOM(d); scrollBottom(); }
      else markUnread(d.channel);
      break;

    case 'file-data':
      storedFiles[d.fileId] = { name:d.filename, size:d.size, type:d.filetype, data:d.data };
      // Enable download button if visible
      const dlBtn = document.getElementById('dl-'+d.fileId);
      if (dlBtn) dlBtn.disabled = false;
      break;
  }
}

// ─── INIT APP ────────────────────────────────────
function initApp() {
  document.getElementById('setup-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('user-name-bar').textContent = myName;
  document.getElementById('user-role-bar').textContent = myRole === 'host' ? '⭐ Host' : 'Member';
  document.getElementById('role-badge').textContent = myRole.toUpperCase();
  if (myRole !== 'host') document.getElementById('upload-req-panel').style.display = 'none';

  const av = document.getElementById('user-avatar-bar');
  av.textContent = myName[0].toUpperCase();
  av.style.background = `linear-gradient(135deg, ${myColor}, ${myColor}88)`;

  renderChannels();
  renderOnlineUsers();
  switchChannel('allgemein');
  updateOnlineCount();

  const input = document.getElementById('msg-input');
  input.addEventListener('input', onInput);
  input.addEventListener('keydown', e => {
    if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    setTimeout(()=>{ input.style.height='auto'; input.style.height=Math.min(input.scrollHeight,120)+'px'; },0);
  });
}

// ─── CHANNELS ────────────────────────────────────
function renderChannels() {
  const list = document.getElementById('channels-list');
  let html = `<div class="section-label">KANÄLE <button class="add-channel-btn" onclick="openAddChannel()">＋</button></div>`;
  channels.forEach(c => {
    const active = c.id === activeChannel;
    html += `<div class="channel-item ${active?'active':''}" id="ch-item-${c.id}" onclick="switchChannel('${c.id}')">
      <span class="channel-hash" style="color:${c.color}">#</span>
      <span>${c.name}</span>
      <span class="unread-dot hidden" id="unread-${c.id}"></span>
    </div>`;
  });
  list.innerHTML = html;
}

function switchChannel(id) {
  activeChannel = id;
  const ch = channels.find(c=>c.id===id);
  if (!ch) return;
  document.getElementById('active-channel-name').textContent = ch.name;
  document.getElementById('channel-topic').textContent = ch.topic;
  renderChannels();
  renderMessages();
  renderLiveTyping();
  const dot = document.getElementById('unread-'+id);
  if (dot) dot.classList.add('hidden');
}

function markUnread(id) {
  if (id === activeChannel) return;
  const dot = document.getElementById('unread-'+id);
  if (dot) dot.classList.remove('hidden');
}

function openAddChannel() { document.getElementById('add-channel-modal').classList.remove('hidden'); }
function closeAddChannel() { document.getElementById('add-channel-modal').classList.add('hidden'); }

function confirmAddChannel() {
  let name = document.getElementById('new-channel-name').value.trim().toLowerCase().replace(/\s+/g,'-');
  const topic = document.getElementById('new-channel-topic').value.trim() || 'Kein Thema';
  if (!name) { toast('Name erforderlich','error'); return; }
  if (channels.find(c=>c.id===name)) { toast('Existiert bereits','error'); return; }
  const colorList = ['#00e5ff','#ff6b35','#00ff88','#ff4757','#a29bfe','#fdcb6e'];
  const color = colorList[Math.floor(Math.random()*colorList.length)];
  const ch = { id:name, name, topic, color };
  ws.send(JSON.stringify({ type:'channel-add', channel:ch }));
  channels.push(ch); messages[name] = [];
  renderChannels(); closeAddChannel();
  document.getElementById('new-channel-name').value='';
  document.getElementById('new-channel-topic').value='';
  switchChannel(name);
  toast(`#${name} erstellt`,'success');
}

// ─── MESSAGES ────────────────────────────────────
function renderMessages() {
  const c = document.getElementById('messages');
  c.innerHTML = '';
  (messages[activeChannel]||[]).forEach(m => appendMessageToDOM(m));
  scrollBottom();
}

function appendMessageToDOM(msg) {
  const c = document.getElementById('messages');
  const el = document.createElement('div');

  if (msg.type === 'system') {
    el.className = 'sys-msg';
    el.textContent = msg.text;
    c.appendChild(el); return;
  }

  const color = msg.color || (COLORS[hashStr(msg.author||'?') % COLORS.length]);
  el.className = 'msg-group';

  if (msg.type === 'file-message') {
    el.innerHTML = `
      <div class="msg-avatar" style="background:linear-gradient(135deg,${color},${color}88)">${(msg.author||'?')[0].toUpperCase()}</div>
      <div class="msg-content">
        <div class="msg-header">
          <span class="msg-author" style="color:${color}">${esc(msg.author)}</span>
          <span class="msg-time">${fmtTime(msg.time)}</span>
        </div>
        <div class="file-msg">
          <div class="file-icon">${fileIcon(msg.filename)}</div>
          <div class="file-info">
            <div class="file-name">${esc(msg.filename)}</div>
            <div class="file-size">${fmtSize(msg.fileSize)}</div>
          </div>
          <button class="file-dl" id="dl-${msg.fileId}" onclick="downloadFile('${msg.fileId}')" ${storedFiles[msg.fileId]?'':'disabled'}>⬇ DL</button>
        </div>
      </div>`;
  } else {
    el.innerHTML = `
      <div class="msg-avatar" style="background:linear-gradient(135deg,${color},${color}88)">${(msg.author||'?')[0].toUpperCase()}</div>
      <div class="msg-content">
        <div class="msg-header">
          <span class="msg-author" style="color:${color}">${esc(msg.author)}</span>
          <span class="msg-time">${fmtTime(msg.time)}</span>
        </div>
        <div class="msg-text">${esc(msg.text).replace(/\n/g,'<br>')}</div>
      </div>`;
  }
  c.appendChild(el);
}

function addSystemMsg(channelId, text) {
  const msg = { type:'system', text, time: Date.now() };
  if (!messages[channelId]) messages[channelId]=[];
  messages[channelId].push(msg);
  if (channelId === activeChannel) { appendMessageToDOM(msg); scrollBottom(); }
}

function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text || !ws) return;
  ws.send(JSON.stringify({ type:'message', channel:activeChannel, text }));
  input.value=''; input.style.height='auto';
  stopTyping();
}

// ─── LIVE TYPING ─────────────────────────────────
function onInput(e) {
  if (!ws) return;
  ws.send(JSON.stringify({ type:'typing', channel:activeChannel, text:e.target.value }));
  clearTimeout(typingTimer);
  typingTimer = setTimeout(stopTyping, 2000);
}

function stopTyping() {
  clearTimeout(typingTimer);
  if (ws) ws.send(JSON.stringify({ type:'stopTyping', channel:activeChannel }));
}

function renderLiveTyping() {
  document.querySelectorAll('.live-preview').forEach(el=>el.remove());
  const typing = liveTyping[activeChannel] || {};
  const c = document.getElementById('messages');
  Object.entries(typing).forEach(([user, info]) => {
    if (!info.text) return;
    const el = document.createElement('div');
    el.className = 'live-preview';
    el.id = 'live-'+user;
    const color = info.color || '#00e5ff';
    el.innerHTML = `
      <div class="live-label"><div class="live-pulse"></div><span style="color:${color}">${esc(user)}</span> tippt live</div>
      <div class="live-text">${esc(info.text)}<span class="live-cursor"></span></div>`;
    c.appendChild(el);
  });
  scrollBottom();
}

function updateTypingIndicator() {
  const typing = liveTyping[activeChannel] || {};
  const users = Object.keys(typing).filter(u=>typing[u]?.text);
  const el = document.getElementById('typing-indicator');
  el.innerHTML = users.length ? `<div class="typing-dots"><span></span><span></span><span></span></div> <span style="color:var(--text-secondary)">${users.join(', ')} tippt...</span>` : '';
}

// ─── ONLINE USERS ────────────────────────────────
function renderOnlineUsers() {
  const list = document.getElementById('online-list');
  list.innerHTML = onlineUsers.map(u => `
    <div class="online-item">
      <div class="o-dot"></div>
      <span class="o-name" style="color:${u.color||'var(--text-secondary)'}">${esc(u.name)}</span>
      <span class="o-role">${u.role==='host'?'⭐':''}</span>
    </div>`).join('');
}

function updateOnlineCount() {
  document.getElementById('online-count').textContent = onlineUsers.length + ' online';
}

// ─── FILE UPLOADS ─────────────────────────────────
function triggerFileUpload() { document.getElementById('file-input').click(); }

function handleFileSelect(e) {
  Array.from(e.target.files).forEach(uploadFile);
  e.target.value='';
}

function uploadFile(file) {
  const requestId = uid();
  const fileId = uid();
  const channelId = activeChannel;

  // Show pending card locally
  const localMsg = {
    id: uid(),
    type: 'file-pending-local',
    author: myName,
    color: myColor,
    filename: file.name,
    fileSize: file.size,
    fileId,
    time: Date.now()
  };
  if (!messages[channelId]) messages[channelId]=[];
  messages[channelId].push(localMsg);
  appendFilePendingToDOM(localMsg);
  scrollBottom();

  pendingUploads[requestId] = { file, channelId, msgId: localMsg.id, fileId };

  if (myRole === 'host') {
    // Host approves own uploads instantly
    finalizeUpload(requestId);
  } else {
    ws.send(JSON.stringify({
      type:'file-request', requestId, fileId,
      filename:file.name, fileSize:file.size, filetype:file.type, channel:channelId
    }));
    toast(`📤 Anfrage gesendet: ${file.name}`,'info');
  }
}

function appendFilePendingToDOM(msg) {
  const c = document.getElementById('messages');
  const el = document.createElement('div');
  el.className = 'msg-group'; el.id = 'msg-'+msg.id;
  el.innerHTML = `
    <div class="msg-avatar" style="background:linear-gradient(135deg,${msg.color},${msg.color}88)">${msg.author[0].toUpperCase()}</div>
    <div class="msg-content">
      <div class="msg-header">
        <span class="msg-author" style="color:${msg.color}">${esc(msg.author)}</span>
        <span class="msg-time">${fmtTime(msg.time)}</span>
      </div>
      <div class="file-msg pending-file-msg" id="file-card-${msg.fileId}">
        <div class="file-icon">${fileIcon(msg.filename)}</div>
        <div class="file-info">
          <div class="file-name">${esc(msg.filename)}</div>
          <div class="file-size">${fmtSize(msg.fileSize)}</div>
          <div class="upload-progress-bar"><div class="upload-progress-fill" id="prog-${msg.fileId}" style="width:0%"></div></div>
        </div>
      </div>
      <div class="pending-label" id="pending-label-${msg.fileId}"><span class="spin">⏳</span> Warte auf Genehmigung...</div>
    </div>`;
  c.appendChild(el);
}

function finalizeUpload(requestId) {
  const up = pendingUploads[requestId];
  if (!up) return;
  const { file, channelId, msgId, fileId } = up;

  const progEl = document.getElementById('prog-'+fileId);
  let p = 0;
  const iv = setInterval(()=>{ p=Math.min(p+Math.random()*15,95); if(progEl) progEl.style.width=p+'%'; },200);

  const reader = new FileReader();
  reader.onload = ev => {
    clearInterval(iv);
    if (progEl) progEl.style.width='100%';
    const data = ev.target.result;
    storedFiles[fileId] = { name:file.name, size:file.size, type:file.type, data };

    setTimeout(()=>{
      const card = document.getElementById('file-card-'+fileId);
      const label = document.getElementById('pending-label-'+fileId);
      if (card) {
        card.classList.remove('pending-file-msg');
        card.innerHTML = `
          <div class="file-icon">${fileIcon(file.name)}</div>
          <div class="file-info"><div class="file-name">${esc(file.name)}</div><div class="file-size">${fmtSize(file.size)}</div></div>
          <button class="file-dl" onclick="downloadFile('${fileId}')">⬇ DL</button>`;
      }
      if (label) label.remove();
    },400);

    ws.send(JSON.stringify({
      type:'file-data', requestId, fileId,
      filename:file.name, size:file.size, filetype:file.type,
      channel:channelId, data
    }));
    toast(`✅ ${file.name} gesendet`,'success');
    delete pendingUploads[requestId];
  };
  reader.readAsDataURL(file);
}

function markDenied(requestId) {
  const up = pendingUploads[requestId];
  if (!up) return;
  const label = document.getElementById('pending-label-'+up.fileId);
  if (label) label.innerHTML='<span style="color:var(--red)">❌ Abgelehnt vom Host</span>';
  delete pendingUploads[requestId];
}

// ─── UPLOAD REQUESTS (HOST) ───────────────────────
function renderUploadRequests() {
  const list = document.getElementById('upload-req-list');
  const count = document.getElementById('req-count');
  const reqs = Object.values(uploadRequestsLocal);
  count.textContent = reqs.length;
  if (!reqs.length) {
    list.innerHTML='<div style="font-size:11px;color:var(--text-muted);text-align:center;padding:8px 0">Keine Anfragen</div>';
    return;
  }
  list.innerHTML = reqs.map(r=>`
    <div class="upload-req-item" id="req-${r.requestId}">
      <div class="req-filename">${esc(r.filename)}</div>
      <div class="req-meta">${fmtSize(r.fileSize)} · ${esc(r.requester)} · #${r.channel}</div>
      <div class="req-btns">
        <button class="req-allow" onclick="approveReq('${r.requestId}')">✓ Erlauben</button>
        <button class="req-deny" onclick="denyReq('${r.requestId}')">✕ Ablehnen</button>
      </div>
    </div>`).join('');
}

function approveReq(requestId) {
  ws.send(JSON.stringify({ type:'file-approve', requestId }));
  delete uploadRequestsLocal[requestId];
  renderUploadRequests();
  toast('✅ Genehmigt','success');
}

function denyReq(requestId) {
  ws.send(JSON.stringify({ type:'file-deny', requestId }));
  delete uploadRequestsLocal[requestId];
  renderUploadRequests();
}

// ─── DOWNLOAD ────────────────────────────────────
function downloadFile(fileId) {
  const f = storedFiles[fileId];
  if (!f) { toast('Datei nicht verfügbar','error'); return; }
  const a = document.createElement('a'); a.href=f.data; a.download=f.name; a.click();
}

// ─── UTILS ───────────────────────────────────────
function uid() { return Math.random().toString(36).slice(2)+Date.now().toString(36); }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtTime(t) { const d=new Date(t); return d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}); }
function fmtSize(b) {
  if(!b) return '?';
  if(b<1024) return b+' B';
  if(b<1048576) return (b/1024).toFixed(1)+' KB';
  if(b<1073741824) return (b/1048576).toFixed(1)+' MB';
  return (b/1073741824).toFixed(2)+' GB';
}
function fileIcon(n) {
  const ext=(n||'').split('.').pop().toLowerCase();
  const m={pdf:'📕',doc:'📘',docx:'📘',xls:'📗',xlsx:'📗',ppt:'📙',pptx:'📙',txt:'📄',jpg:'🖼️',jpeg:'🖼️',png:'🖼️',gif:'🖼️',webp:'🖼️',mp4:'🎬',mkv:'🎬',avi:'🎬',mov:'🎬',mp3:'🎵',wav:'🎵',zip:'📦',rar:'📦',tar:'📦',gz:'📦',js:'⚡',py:'🐍',html:'🌐',css:'🎨',exe:'⚙️'};
  return m[ext]||'📄';
}
function hashStr(s) { let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))|0; return Math.abs(h); }
function scrollBottom() { const m=document.getElementById('messages'); m.scrollTop=m.scrollHeight; }
function toast(msg, type='info') {
  const c=document.getElementById('toast-container');
  const t=document.createElement('div'); t.className=`toast ${type}`;
  const icons={success:'✅',error:'❌',info:'ℹ️'};
  t.innerHTML=`<span>${icons[type]||'ℹ️'}</span><span>${msg}</span>`;
  c.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transform='scale(.9)'; t.style.transition='all .3s'; setTimeout(()=>t.remove(),300); },3500);
}
</script>
